# Blueprint Render — web + PostgreSQL infinity-bajas (plan Free)

services:
  - type: web
    name: infinity-bajas
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-bajas
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: infinity-bajas
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: infinity-bajas
    plan: free
    region: oregon
    databaseName: infinity_bajas
    user: infinity
